name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Install CPU-only PyTorch first so pip does not pull the ~2.5 GB
      # default (CUDA) wheel as a marker-pdf dependency.
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package with dev tools
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: CLI checks
        run: |
          pdf-pipeline --help
          pdf-pipeline smoke-test --workdir /tmp/smoke

  build:
    name: Build & verify distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: pip install "build>=1.2" "twine>=6.1"

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check --strict dist/*

      - name: Verify wheel includes bundled samples
        run: |
          unzip -l dist/*.whl | grep -F "pdf_pipeline/samples/sample_report.pdf"
          unzip -l dist/*.whl | grep -F "samples/markdown_output/sample_report/sample_report.md"

      # Catches "works in editable mode, broken from the wheel" issues such
      # as missing package-data or a broken entry point.
      - name: Install wheel in a clean venv and run smoke test
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/pdf-pipeline --version
          /tmp/verify/bin/pdf-pipeline smoke-test --workdir /tmp/smoke

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
